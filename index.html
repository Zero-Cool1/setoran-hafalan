window.generateRandomPass = function() {
  const c = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  let p = ""; for (let i = 0; i < 6; i++) p += c.charAt(Math.floor(Math.random() * c.length));
  return p;
};

window.apiCall = async function(action, payload, retries = 2) {
  const body = JSON.stringify({ action, payload });
  let lastError = '';
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);
      const r = await fetch(GAS_URL, {
        method: 'POST', body: body,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        redirect: 'follow', signal: controller.signal
      });
      clearTimeout(timeoutId);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      try { return JSON.parse(text); }
      catch { throw new Error('Response bukan JSON. Cek deployment GAS.'); }
    } catch (e) {
      lastError = e.message;
      if (attempt < retries) await new Promise(res => setTimeout(res, 800 * (attempt + 1)));
    }
  }
  return { success: false, message: 'Gagal terhubung ke database: ' + lastError };
};

window.copyToClipboard = function(text) {
  const el = document.createElement('textarea');
  el.value = text; document.body.appendChild(el); el.select();
  try { document.execCommand('copy'); Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Tersalin!', showConfirmButton: false, timer: 1800 }); }
  catch { Swal.fire({ toast: true, position: 'top-end', icon: 'error', title: 'Gagal menyalin', showConfirmButton: false, timer: 1800 }); }
  document.body.removeChild(el);
};

window.togglePassword = function() {
  const p = document.getElementById('password'), i = document.getElementById('toggle-icon');
  if (p.type === 'password') { p.type = 'text'; i.classList.remove('fa-eye'); i.classList.add('fa-eye-slash','text-green-600'); }
  else { p.type = 'password'; i.classList.remove('fa-eye-slash','text-green-600'); i.classList.add('fa-eye'); }
};

window.searchData = function(sel, kw) {
  const k = kw.toLowerCase();
  document.querySelectorAll(sel).forEach(el => el.style.display = el.innerText.toLowerCase().includes(k) ? '' : 'none');
};

    return `<div class="abs-card bg-white p-3 rounded-xl shadow-sm border mb-2 flex items-center justify-between">
      <div class="flex-grow min-w-0">
        <h4 class="font-bold text-xs truncate">${a.nama_santri}</h4>
        <p class="text-[10px] text-gray-500">${new Date(a.tanggal).toLocaleDateString('id-ID')} • ${a.halaqah || '-'}</p>
      </div>
      <span class="px-2 py-1 rounded-md text-[10px] font-bold border ${color}">${a.status}</span>
    </div>`;
  }).join('');
  return items || `<div class="text-center p-6 bg-white rounded-xl border border-dashed text-gray-400 text-sm">Belum ada data absensi.</div>`;
};

window.renderAbsensiList = function() {
  const kelas = document.getElementById('abs-kelas').value;

  if (!kelas) { container.innerHTML = ''; return; }

window.markAllAbsen = function(status) {
  document.querySelectorAll('.abs-row').forEach(row => {
    const btns = row.querySelectorAll('.abs-btn');
    btns.forEach(b => {
      const st = b.innerText.trim();
      const c = st === 'Hadir' ? 'green' : st === 'Sakit' ? 'yellow' : st === 'Izin' ? 'blue' : 'red';
      if (st === status) {
        b.className = `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-${c}-500 text-white border-${c}-500`;
        b.dataset.status = st;
      } else {
        b.className = `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-white text-gray-500 border-gray-200`;
        b.dataset.status = '';
      }
    });
  });
};

window.pickStatus = function(btn, status) {
  const row = btn.closest('.abs-row');
  row.querySelectorAll('.abs-btn').forEach(b => {
    const st = b.innerText.trim();
    const c = st === 'Hadir' ? 'green' : st === 'Sakit' ? 'yellow' : st === 'Izin' ? 'blue' : 'red';
    if (st === status) {
      b.className = `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-${c}-500 text-white border-${c}-500`;
      b.dataset.status = st;
    } else {
      b.className = `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-white text-gray-500 border-gray-200`;
      b.dataset.status = '';
    }
  });
};

window.populateAbsensiView = function() {};

window.submitAbsensiMassal = async function() {
  const tanggal = document.getElementById('abs-tanggal').value;
  if (!tanggal) return Swal.fire('Peringatan', 'Isi tanggal terlebih dahulu.', 'warning');
  const rows = document.querySelectorAll('.abs-row');
  if (rows.length === 0) return Swal.fire('Peringatan', 'Pilih kelas dulu.', 'warning');
  const data = [];
  rows.forEach(r => {
    const active = r.querySelector('.abs-btn.text-white');
    const status = active ? (active.dataset.status || active.innerText.trim()) : 'Alpa';
    const ket = r.querySelector('.abs-ket').value;
    data.push({
      tanggal, id_santri: r.dataset.id, nama_santri: r.dataset.nama,
      halaqah: r.dataset.halaqah, status, keterangan: ket || '-',
      nama_ustadz: state.user.nama_lengkap
    });
  });
  Swal.fire({ title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
  const res = await window.apiCall('addAbsensiMassal', { data });
  if (res.success) { Swal.fire('Berhasil', res.message, 'success'); window.loadDashboardData(); }
  else Swal.fire('Gagal', res.message, 'error');
};

// ==== MULTI-SURAH PICKER HELPERS ====
window.toggleSurahPicker = function() {
  const dd = document.getElementById('surah-dropdown');
  if (dd) dd.classList.toggle('hidden');
};

window.filterSurah = function(kw) {
  const k = kw.toLowerCase();
  document.querySelectorAll('.surah-opt').forEach(el => {
    el.style.display = el.dataset.name.toLowerCase().includes(k) ? '' : 'none';
  });
};

window.toggleSurah = function(surah, checked) {
  if (checked) {
    if (!state.selectedSurahs.includes(surah)) state.selectedSurahs.push(surah);
  } else {
    state.selectedSurahs = state.selectedSurahs.filter(s => s !== surah);
  }
  window.updateChipsUI();
};

window.removeSurah = function(s) {
  state.selectedSurahs = state.selectedSurahs.filter(x => x !== s);
  document.querySelectorAll('.surah-opt').forEach(el => {
    if (el.dataset.name === s) {
      const cb = el.querySelector('input[type="checkbox"]');
      if (cb) cb.checked = false;
    }
  });
  window.updateChipsUI();
};

window.updateChipsUI = function() {
  const c = document.getElementById('surah-chips');
  const cnt = document.getElementById('surah-count');
  const lbl = document.getElementById('surah-picker-label');
  if (!c) return;
  c.innerHTML = state.selectedSurahs.map(s =>
    `<span class="inline-flex items-center gap-1 bg-purple-100 text-purple-700 text-[10px] px-2 py-1 rounded-full">${s} <button type="button" onclick="window.removeSurah('${s.replace(/'/g, "\\'")}')" class="text-purple-900 font-bold leading-none">×</button></span>`
  ).join('');
  if (cnt) cnt.textContent = state.selectedSurahs.length + ' surah terpilih';
  if (lbl) {
    lbl.innerHTML = state.selectedSurahs.length
      ? `<span class="text-purple-700 font-bold">${state.selectedSurahs.length} surah dipilih</span>`
      : `<span class="text-gray-500">Pilih Surah...</span>`;
  }
};

window.handleLogin = async function(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const errorDiv = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  if (errorDiv) errorDiv.classList.add('hidden');
  if (document.activeElement) document.activeElement.blur();
  if (btn) { btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1"></i> Memeriksa...'; btn.disabled = true; }
  await new Promise(r => setTimeout(r, 100));
  const res = await window.apiCall('login', { username: u, password: p });
  if (res.success) {
    state.user = res.user;
    try { localStorage.setItem('tahfidz_user', JSON.stringify(res.user)); } catch(e) {}
    state.activeTab = 'beranda';
    state.activeTabOrtu = 'beranda';
    window.renderApp();
    window.loadDashboardData();

    if (btn) { btn.innerHTML = 'Masuk Sekarang'; btn.disabled = false; }
    if (errorDiv) { errorDiv.innerHTML = `<i class="fas fa-exclamation-circle mr-1"></i> ${res.message || 'Username/Password salah!'}`; errorDiv.classList.remove('hidden'); }

};

window.compressAndPreviewImage = function(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX = 150; let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d'); ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      const b64 = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('preview-logo').src = b64;
      document.getElementById('inp-logo-base64').value = b64;
    }; img.src = e.target.result;
  }; reader.readAsDataURL(file);
};

window.handleImportExcel = function() {
  const f = document.getElementById('file-excel').files[0]; if (!f) return Swal.fire('Peringatan', 'Pilih file Excel', 'warning');
  const reader = new FileReader();
  reader.onload = async function(e) {
    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
    const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
    const pData = [];
    for (let i = 1; i < data.length; i++) {
      if (data[i][0] && data[i][1]) pData.push({ nis: data[i][0].toString(), nama: data[i][1], halaqah: data[i][2] || '-', username_ortu: data[i][1].split(" ")[0].toLowerCase().replace(/[^a-z0-9]/g, "") + data[i][0].toString(), password_ortu: window.generateRandomPass() });
    }
    if (pData.length === 0) return Swal.fire('Error', 'File kosong/format salah', 'error');
    document.getElementById('modal-excel').classList.add('hidden');
    Swal.fire({ title: 'Mengimport...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
    const res = await window.apiCall('addSantriMassal', { data: pData });
    if (res.success) { Swal.fire('Berhasil', res.message, 'success'); window.loadDashboardData(); }
  }; reader.readAsArrayBuffer(f);
};

window.prosesCetakRapor = function(fmt) {
  const id = document.getElementById('rapor-id-santri').value, p = document.getElementById('rapor-periode').value, s = state.santri.find(x => x.id_santri === id);
  let d = state.setoran.filter(x => x.id_santri === id);
  const now = new Date();
  if (p === 'bulan_ini') d = d.filter(x => new Date(x.tanggal).getMonth() === now.getMonth() && new Date(x.tanggal).getFullYear() === now.getFullYear());
  else if (p === 'bulan_lalu') { const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1); d = d.filter(x => new Date(x.tanggal).getMonth() === lm.getMonth() && new Date(x.tanggal).getFullYear() === lm.getFullYear()); }
  document.getElementById('modal-rapor').classList.add('hidden');
  if (d.length === 0) return Swal.fire('Info', 'Tidak ada data', 'info');
  d.sort((a, b) => new Date(a.tanggal) - new Date(b.tanggal));
  fmt === 'excel' ? window.cetakRaporExcel(s, d) : window.cetakRaporPDF(s, d);
};

window.generateSertifikat = function(e) {

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    doc.setFillColor(252, 253, 248); doc.rect(0, 0, 297, 210, 'F');
    doc.setDrawColor(218, 165, 32); doc.setLineWidth(4); doc.rect(12, 12, 273, 186);
    doc.setDrawColor(21, 128, 61); doc.setLineWidth(1); doc.rect(17, 17, 263, 176);
    if (state.pengaturan.logo && state.pengaturan.logo.startsWith('data:image')) {
      doc.setGState(new doc.GState({ opacity: 0.05 })); doc.addImage(state.pengaturan.logo, 'PNG', 98, 55, 100, 100); doc.setGState(new doc.GState({ opacity: 1.0 }));
      doc.addImage(state.pengaturan.logo, 'PNG', 138, 20, 20, 20);
    }
    doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(21, 128, 61); doc.text((state.pengaturan.nama_lembaga || '').toUpperCase(), 148.5, 46, { align: 'center' });
    doc.setFontSize(32); doc.setTextColor(218, 165, 32); doc.text("SYAHADAH TAHFIDZ AL-QURAN", 148.5, 70, { align: 'center' });
    doc.setFont("times", "bolditalic"); doc.setFontSize(40); doc.setTextColor(0, 0, 0); doc.text(n, 148.5, 100, { align: 'center' });
    doc.setFont("helvetica", "normal"); doc.setFontSize(12); doc.setTextColor(80, 80, 80); doc.text(`NIS: ${s.nis || '-'}   |   Halaqah: ${s.halaqah}`, 148.5, 112, { align: 'center' });
    doc.setFontSize(14); doc.setTextColor(50, 50, 50); doc.text("Telah menyelesaikan pencapaian:", 148.5, 126, { align: 'center' });
    doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(21, 128, 61); doc.text(`"${penghargaan}"`, 148.5, 138, { align: 'center' });
    const today = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
    doc.setFontSize(12); doc.setTextColor(50, 50, 50); doc.text(`Ditetapkan: ${today}`, 230, 168, { align: 'center' });
    doc.text("Pimpinan", 230, 174, { align: 'center' });
    doc.line(195, 187, 265, 187);
    doc.setFont("helvetica", "bold"); doc.text(state.pengaturan.nama_pimpinan || 'Pimpinan TPQ', 230, 191, { align: 'center' });
    doc.save(`Syahadah_${n.replace(/\s+/g, '_')}.pdf`);
    Swal.fire('Berhasil', 'Sertifikat diunduh!', 'success');
  } catch (err) { Swal.fire('Error', 'Gagal: ' + err.message, 'error'); }
};

document.addEventListener('DOMContentLoaded', () => {
  try {
    const savedPeng = localStorage.getItem('tahfidz_pengaturan');
    if (savedPeng) state.pengaturan = JSON.parse(savedPeng);
  } catch(e) {}

  try {
    const saved = localStorage.getItem('tahfidz_user');
    if (saved) {
      const u = JSON.parse(saved);
      if (u && u.username && u.role) {
        state.user = u;
        window.loadDashboardData();
        return;
      }
    }
  } catch (e) { console.warn('Restore session gagal:', e); }
  window.renderApp();
});
