window.apiCall = async function(action, payload, retries = 2) {
  const body = JSON.stringify({ action, payload: payload || {} });
  let lastErr = '';
  for (let a = 0; a <= retries; a++) {
    try {
      const ctrl = new AbortController();
      const tid = setTimeout(() => ctrl.abort(), 20000);
      const r = await fetch(GAS_URL, { method:'POST', body, headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal:ctrl.signal });
      clearTimeout(tid);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const t = await r.text();
      try { return JSON.parse(t); } catch { throw new Error('Response bukan JSON'); }
    } catch(e) { lastErr = e.message; if (a < retries) await new Promise(z => setTimeout(z, 800*(a+1))); }
  }
  return { success:false, message:'Gagal koneksi: ' + lastErr };
};

window.genPass = function() {
  const c = "abcdefghijkmnpqrstuvwxyz23456789"; let p = "";
  for (let i=0;i<6;i++) p += c.charAt(Math.floor(Math.random()*c.length));
  return p;
};

window.copyText = function(t) {
  const el = document.createElement('textarea'); el.value = t; document.body.appendChild(el); el.select();
  try { document.execCommand('copy'); Swal.fire({toast:true,position:'top-end',icon:'success',title:'Tersalin!',showConfirmButton:false,timer:1500}); }
  catch { Swal.fire({toast:true,position:'top-end',icon:'error',title:'Gagal',showConfirmButton:false,timer:1500}); }
  document.body.removeChild(el);
};

window.togglePass = function() {
  const p = document.getElementById('password'); const i = document.getElementById('toggle-icon');
  if (!p) return;
  if (p.type==='password'){p.type='text';i.classList.remove('fa-eye');i.classList.add('fa-eye-slash','text-green-600');}
  else{p.type='password';i.classList.remove('fa-eye-slash','text-green-600');i.classList.add('fa-eye');}
};

window.searchFilter = function(sel, kw) {
  const k = kw.toLowerCase();
  document.querySelectorAll(sel).forEach(el => el.style.display = el.innerText.toLowerCase().includes(k) ? '' : 'none');
};

window.renderApp = function() {
  const root = document.getElementById('app-root');

  const r = state.user.role;
  if (r === 'AdminPusat') root.innerHTML = renderAdminDashboard();
  else if (r === 'Ustadz') root.innerHTML = renderUstadzDashboard();
  else if (r === 'OrangTua') root.innerHTML = renderOrtuDashboard();
  else root.innerHTML = renderLogin();
};

}

function viewAdminKelas() {

        <p class="text-[11px] text-amber-700 mt-0.5">${p.dari_kelas} → <b>${p.ke_kelas}</b></p>

    const santriKelas = state.santri.filter(s => s.halaqah === openK);
    const kelasLain = state.kelas.filter(k => k.nama_kelas !== openK);
    return `

      <p class="text-teal-100 text-xs mt-1">${santriKelas.length} santri</p>
    </div>
    <input type="text" onkeyup="searchFilter('.sa-card', this.value)" placeholder="🔍 Cari santri..." class="w-full bg-white border rounded-xl p-3 text-sm outline-none mb-3 shadow-sm">

          <button onclick="openMoveSantri('${s.id_santri}','${(s.nama_santri||s.nama).replace(/'/g,"\\'")}','${openK}')" class="bg-blue-50 text-blue-600 border border-blue-200 px-2 py-1.5 rounded-lg text-[10px] font-bold"><i class="fas fa-exchange-alt"></i> Pindah</button>

  return `

function renderUstadzDashboard() {

    state.activeTabUstadz === 'kelas' ? viewUstadzKelas() :
    state.activeTabUstadz === 'setoran' ? viewUstadzSetoran('Hafalan') :

    const kelasLain = state.kelas.filter(k => k.nama_kelas !== openK);
    return `

      santriKelas.map((s,i) => {
        const n = s.nama_santri||s.nama||'Tanpa Nama';
        return `

function renderSantriPickerHTML(list) {
  if (list.length === 0) return `<p class="text-center text-xs text-gray-400 py-4">Tidak ada santri</p>`;
  return list.map(s => {
    const n = s.nama_santri||s.nama||'Tanpa Nama';
    return `<label class="flex items-center gap-2 p-2 hover:bg-white rounded cursor-pointer text-sm"><input type="checkbox" class="santri-cb w-4 h-4 text-blue-600" value="${s.id_santri}" data-nama="${n.replace(/"/g,'&quot;')}" onchange="updateSantriCount()"><span class="truncate">${n}</span><span class="text-[10px] text-gray-400 ml-auto">${s.halaqah||''}</span></label>`;
  }).join('');
}

window.renderSantriPicker = function(jenis) {
  const kelas = document.getElementById('sm-kelas').value;
  const myKelas = state.kelas.filter(k => state.kelasDiampu.includes(k.nama_kelas)).map(k => k.nama_kelas);
  let list = state.santri.filter(s => myKelas.includes(s.halaqah));
  if (kelas) list = list.filter(s => s.halaqah === kelas);
  const el = document.getElementById('santri-picker');
  if (el) el.innerHTML = renderSantriPickerHTML(list);
  updateSantriCount();
};

window.updateSantriCount = function() {
  const cbs = document.querySelectorAll('.santri-cb:checked');
  const el = document.getElementById('santri-count');
  if (el) el.textContent = cbs.length + ' santri terpilih';
};

window.toggleSurah = function(s, chk) {
  if (chk) { if (!state.selectedSurahs.includes(s)) state.selectedSurahs.push(s); }
  else state.selectedSurahs = state.selectedSurahs.filter(x => x !== s);
  refreshSurahUI();
};

window.removeSurah = function(s) {
  state.selectedSurahs = state.selectedSurahs.filter(x => x !== s);
  document.querySelectorAll('.surah-opt').forEach(el => {
    if (el.dataset.name === s) { const cb = el.querySelector('input'); if (cb) cb.checked = false; }
  });
  refreshSurahUI();
};

function refreshSurahUI() {
  const chips = document.getElementById('surah-chips');
  const lbl = document.getElementById('surah-lbl');
  const cnt = document.getElementById('surah-cnt');
  if (chips) chips.innerHTML = state.selectedSurahs.map(x => `<span class="chip">${x} <button type="button" onclick="removeSurah('${x.replace(/'/g,"\\'")}')" class="text-purple-900 font-bold">×</button></span>`).join('');
  if (lbl) lbl.innerHTML = state.selectedSurahs.length ? `<span class="text-purple-700 font-bold">${state.selectedSurahs.length} surah dipilih</span>` : `<span class="text-gray-500">Pilih Surah...</span>`;
  if (cnt) cnt.textContent = state.selectedSurahs.length + ' surah';
}

window.filterSurah = function(kw) {
  const k = kw.toLowerCase();
  document.querySelectorAll('.surah-opt').forEach(el => el.style.display = el.dataset.name.toLowerCase().includes(k) ? '' : 'none');
};

window.markAllAbsen = function(st) {
  document.querySelectorAll('.abs-row').forEach(r => {
    r.querySelectorAll('.abs-btn').forEach(b => {
      const s = b.innerText.trim();
      const c = s==='Hadir'?'green':s==='Sakit'?'yellow':s==='Izin'?'blue':'red';
      b.className = s===st ? `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-${c}-500 text-white border-${c}-500` : `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-white text-gray-500 border-gray-200`;
      b.dataset.status = s===st ? s : '';
    });
  });
};

window.pickStatus = function(btn, st) {
  const row = btn.closest('.abs-row');
  row.querySelectorAll('.abs-btn').forEach(b => {
    const s = b.innerText.trim();
    const c = s==='Hadir'?'green':s==='Sakit'?'yellow':s==='Izin'?'blue':'red';
    b.className = s===st ? `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-${c}-500 text-white border-${c}-500` : `abs-btn flex-1 text-[10px] font-bold py-1.5 rounded border bg-white text-gray-500 border-gray-200`;
    b.dataset.status = s===st ? s : '';
  });
};

function viewUstadzRiwayat() {
  const myKelas = state.kelas.filter(k => state.kelasDiampu.includes(k.nama_kelas)).map(k => k.nama_kelas);
  const mySantriIds = state.santri.filter(s => myKelas.includes(s.halaqah)).map(s => s.id_santri);
  const filter = `<div class="flex gap-2 mb-4"><button onclick="state.riwayatFilter='setoran';renderApp()" class="flex-1 text-xs font-bold py-2 rounded-lg ${state.riwayatFilter==='absensi'?'bg-gray-100 text-gray-500':'bg-green-600 text-white'}">Setoran</button><button onclick="state.riwayatFilter='absensi';renderApp()" class="flex-1 text-xs font-bold py-2 rounded-lg ${state.riwayatFilter==='absensi'?'bg-red-600 text-white':'bg-gray-100 text-gray-500'}">Absensi</button></div>`;
  if (state.riwayatFilter === 'absensi') {
    const items = state.absensi.filter(a => mySantriIds.includes(a.id_santri)).map(a => {
      const c = a.status==='Hadir'?'bg-green-100 text-green-700 border-green-200':a.status==='Sakit'?'bg-yellow-100 text-yellow-700 border-yellow-200':a.status==='Izin'?'bg-blue-100 text-blue-700 border-blue-200':'bg-red-100 text-red-700 border-red-200';
      return `<div class="abs-card bg-white p-4 rounded-xl shadow-sm border mb-2"><div class="flex justify-between items-start mb-1"><div><h4 class="font-bold text-sm">${a.nama_santri}</h4><span class="text-[10px] text-gray-400">${new Date(a.tanggal).toLocaleDateString('id-ID')} • ${a.halaqah}</span></div><span class="px-2 py-1 rounded text-[10px] font-bold border ${c}">${a.status}</span></div></div>`;
    }).join('');
    return filter + `<input type="text" onkeyup="searchFilter('.abs-card',this.value)" placeholder="🔍 Cari..." class="w-full bg-white border rounded-xl p-3 text-sm outline-none mb-4 shadow-sm">${items || `<div class="text-center p-8 bg-white rounded-xl border text-gray-400 text-sm">Belum ada</div>`}`;
  }
  const cards = state.setoran.filter(s => mySantriIds.includes(s.id_santri)).map(s => {
    const c = (s.kualitas||'').match(/Muntaz|Jayyid|Lancar/) ? 'text-green-700 bg-green-100 border-green-200' : 'text-red-700 bg-red-100 border-red-200';
    const jenis = s.jenis || 'Hafalan';
    const detail = jenis === 'Tilawah' ? (s.surah && s.surah !== '-' ? s.surah : '-') : `${s.surah||'-'} (${s.ayat||'-'})`;
    return `<div class="riwayat-card bg-white p-4 rounded-xl shadow-sm border mb-2"><div class="flex justify-between items-start mb-1"><div><h4 class="font-bold text-sm">${s.nama_santri}</h4><span class="text-[10px] text-gray-400">${new Date(s.tanggal).toLocaleDateString('id-ID')} • <span class="text-indigo-600 font-bold">${jenis}</span></span></div><span class="px-2 py-1 rounded text-[10px] font-bold border ${c}">${s.kualitas}</span></div><p class="text-xs font-bold mt-1">${detail}</p><p class="text-[11px] text-gray-500 italic">${s.catatan||'-'}</p></div>`;
  }).join('');
  return filter + `<input type="text" onkeyup="searchFilter('.riwayat-card',this.value)" placeholder="🔍 Cari..." class="w-full bg-white border rounded-xl p-3 text-sm outline-none mb-4 shadow-sm">${cards || `<div class="text-center p-8 bg-white rounded-xl border text-gray-400 text-sm">Belum ada</div>`}`;
}

function viewOrtuAbsensi() {
  const data = state.absensi || [];
  const hadir = data.filter(a=>a.status==='Hadir').length;
  const sakit = data.filter(a=>a.status==='Sakit').length;
  const izin = data.filter(a=>a.status==='Izin').length;
  const alpa = data.filter(a=>a.status==='Alpa').length;
  const persen = data.length > 0 ? Math.round((hadir/data.length)*100) : 0;

window.handleLogin = async function(e) {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const errD = document.getElementById('login-error');
  const btn = document.getElementById('btn-login');
  if (errD) errD.classList.add('hidden');
  if (document.activeElement) document.activeElement.blur();
  if (btn) { btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Memeriksa...'; btn.disabled = true; }
  const res = await apiCall('login', { username: u, password: p });
  if (res.success) {
    state.user = res.user;
    try { localStorage.setItem('tahfidz_user', JSON.stringify(res.user)); } catch(e) {}
    state.activeTabAdmin = 'beranda'; state.activeTabUstadz = 'kelas'; state.activeTabOrtu = 'hafalan';
    renderApp(); loadData();
  } else {
    if (btn) { btn.innerHTML = 'Masuk'; btn.disabled = false; }
    if (errD) { errD.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${res.message||'Username/Password salah!'}`; errD.classList.remove('hidden'); }
  }
};

window.logout = function() {
  try { localStorage.removeItem('tahfidz_user'); } catch(e) {}
  state.user = null; state.selectedSurahs = []; state.unlockedKelas = {};
  renderApp();
};

window.loadData = async function() {
  state.isLoading = true; renderApp();
  const r = state.user.role;
  const action = r === 'AdminPusat' ? 'getDataAdmin' : r === 'Ustadz' ? 'getDataUstadz' : 'getDataOrtu';
  const payload = r === 'Ustadz' ? { id_user: state.user.id_user } : r === 'OrangTua' ? { id_santri: state.user.id_santri } : {};
  const res = await apiCall(action, payload);
  if (res.success) {
    state = { ...state, ...res };
    state.isLoading = false;
    if (res.pengaturan) { try { localStorage.setItem('tahfidz_pengaturan', JSON.stringify(res.pengaturan)); } catch(e) {} }
    renderApp();
  } else {
    state.isLoading = false; renderApp();
    Swal.fire('Gagal memuat data', res.message, 'error');
  }
};

window.switchAdmin = function(t) { state.activeTabAdmin = t; state.openKelasAdmin = null; renderApp(); };
window.switchUstadz = function(t) { state.activeTabUstadz = t; state.selectedSurahs = []; state.openKelasUstadz = null; renderApp(); };

window.submitSync = async function() {
  const idUser = document.getElementById('sync-id-user').value;
  const username = document.getElementById('sync-username').value;
  const nama = document.getElementById('sync-nama-ust').value;
  const password = document.getElementById('sync-password').value;
  const selected = Array.from(document.querySelectorAll('.sync-kelas-cb:checked')).map(cb => cb.value);
  if (selected.length === 0 && password === '') return Swal.fire('Info', 'Pilih minimal 1 kelas', 'info');
  document.getElementById('modal-sync').classList.add('hidden');
  Swal.fire({ title:'Menyimpan...', allowOutsideClick:false, didOpen:() => Swal.showLoading() });
  for (const k of selected) {
    await apiCall('updateKelasPassword', { nama_kelas: k, password });
  }
  const existing = state.ustadzKelas.filter(a => a.id_user === idUser).map(a => a.nama_kelas);
  for (const k of selected) {
    if (!existing.includes(k)) {
      await apiCall('assignUstadzKelas', { id_user: idUser, username, nama_ustadz: nama, nama_kelas: k });
    }
  }
  Swal.fire('Berhasil', 'Sinkronisasi tersimpan', 'success');
  loadData();
};

window.submitAbsensiMassal = async function() {
  const tanggal = document.getElementById('abs-tgl').value;
  if (!tanggal) return Swal.fire('Peringatan', 'Isi tanggal', 'warning');
  const rows = document.querySelectorAll('.abs-row');
  if (rows.length === 0) return Swal.fire('Peringatan', 'Pilih kelas dulu', 'warning');
  const data = [];
  rows.forEach(r => {
    const active = r.querySelector('.abs-btn.text-white');
    const status = active ? (active.dataset.status || active.innerText.trim()) : 'Alpa';
    const ket = r.querySelector('.abs-ket').value;
    data.push({ tanggal, id_santri: r.dataset.id, nama_santri: r.dataset.nama, halaqah: r.dataset.halaqah, status, keterangan: ket || '-', nama_ustadz: state.user.nama_lengkap });
  });
  Swal.fire({ title:'Menyimpan...', allowOutsideClick:false, didOpen:() => Swal.showLoading() });
  const res = await apiCall('addAbsensiMassal', { data });

window.compressLogo = function(event) {
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const MAX = 150; let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h *= MAX/w; w = MAX; } } else { if (h > MAX) { w *= MAX/h; h = MAX; } }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d'); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
      const b64 = canvas.toDataURL('image/jpeg', 0.6);
      document.getElementById('preview-logo').src = b64;
      document.getElementById('inp-logo-base64').value = b64;
    }; img.src = e.target.result;
  }; reader.readAsDataURL(file);
};

  const s = state.santri.find(x => x.id_santri === id); if (!s) return;
  Swal.fire({
    title: 'Update Progress',
    html: `<div style="text-align:left"><p style="font-weight:bold;margin-bottom:8px">${s.nama_santri||s.nama}</p>
      <label style="font-size:12px;color:#666">Jumlah Hafalan</label><input id="sw-jml" class="swal2-input" value="${s.jumlah_hafalan||''}" style="margin:5px 0">
      <label style="font-size:12px;color:#666">Juz Selesai</label><input id="sw-juz" class="swal2-input" value="${s.juz_hafal||''}" style="margin:5px 0">

window.openRapor = function(id) {
  const s = state.santri.find(x => x.id_santri === id); if (!s) return;
  Swal.fire({
    title: 'Cetak Rapor',
    html: `<p style="font-weight:bold;margin-bottom:8px">${s.nama_santri||s.nama}</p>`,
    showCancelButton: true, confirmButtonText: 'PDF', showDenyButton: true, denyButtonText: 'Excel'
  }).then(r => {
    if (r.isConfirmed) cetakRapor(id, 'pdf');
    else if (r.isDenied) cetakRapor(id, 'excel');
  });
};

window.cetakRapor = function(id, fmt) {
  const s = state.santri.find(x => x.id_santri === id);
  let d = state.setoran.filter(x => x.id_santri === id);
  if (d.length === 0) return Swal.fire('Info', 'Belum ada data', 'info');
  d.sort((a,b) => new Date(a.tanggal) - new Date(b.tanggal));
  const n = s.nama_santri||s.nama;
  if (fmt === 'excel') {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['LAPORAN TAHFIDZ'],['Santri:',n],['NIS:',s.nis||'-'],[],['Tanggal','Jenis','Hafalan','Kualitas','Catatan'],...d.map(x=>[new Date(x.tanggal).toLocaleDateString('id-ID'),x.jenis||'Hafalan',`${x.surah||'-'} (${x.ayat||'-'})`,x.kualitas,x.catatan||'-'])]), "Rapor");
    XLSX.writeFile(wb, `Rapor_${n.replace(/\s+/g,'_')}.xlsx`);
    Swal.fire('Berhasil','Excel diunduh','success');
  } else {
    const doc = new window.jspdf.jsPDF();
    doc.setFont("helvetica","bold"); doc.text(state.pengaturan.nama_lembaga, 14, 15);
    doc.setFontSize(10); doc.setFont("helvetica","normal"); doc.text(`Nama: ${n} | NIS: ${s.nis||'-'}`, 14, 22);
    doc.autoTable({ head:[["Tgl","Jenis","Hafalan","Kualitas"]], body: d.map(x=>[new Date(x.tanggal).toLocaleDateString('id-ID'),x.jenis||'Hafalan',`${x.surah||'-'} (${x.ayat||'-'})`,x.kualitas]), startY: 28, styles:{fontSize:8} });
    doc.save(`Rapor_${n.replace(/\s+/g,'_')}.pdf`);
    Swal.fire('Berhasil','PDF diunduh','success');
  }
};

window.openSertifikat = function(id) {
  const s = state.santri.find(x => x.id_santri === id); if (!s) return;
  Swal.fire({
    title: 'Sertifikat',
    html: `<p style="font-weight:bold;margin-bottom:8px">${s.nama_santri||s.nama}</p>
      <input id="sw-penghargaan" class="swal2-input" placeholder="Contoh: Juz 30 Muntaz">`,
    showCancelButton: true, confirmButtonText: 'Download PDF',
    preConfirm: () => ({ id, penghargaan: document.getElementById('sw-penghargaan').value })
  }).then(r => {
    if (!r.isConfirmed || !r.value.penghargaan) return;
    generateSertifikatPDF(id, r.value.penghargaan);
  });
};

window.generateSertifikatPDF = function(id, penghargaan) {
  try {
    const s = state.santri.find(x => x.id_santri === id);
    const n = s.nama_santri||s.nama;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
    doc.setFillColor(252,253,248); doc.rect(0,0,297,210,'F');
    doc.setDrawColor(218,165,32); doc.setLineWidth(4); doc.rect(12,12,273,186);
    doc.setDrawColor(21,128,61); doc.setLineWidth(1); doc.rect(17,17,263,176);
    if (state.pengaturan.logo && state.pengaturan.logo.startsWith('data:image')) {
      doc.setGState(new doc.GState({opacity:0.05})); doc.addImage(state.pengaturan.logo,'PNG',98,55,100,100); doc.setGState(new doc.GState({opacity:1}));
      doc.addImage(state.pengaturan.logo,'PNG',138,20,20,20);
    }
    doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(21,128,61); doc.text((state.pengaturan.nama_lembaga||'').toUpperCase(),148.5,46,{align:'center'});
    doc.setFontSize(32); doc.setTextColor(218,165,32); doc.text("SYAHADAH TAHFIDZ",148.5,70,{align:'center'});
    doc.setFont("times","bolditalic"); doc.setFontSize(40); doc.setTextColor(0,0,0); doc.text(n,148.5,100,{align:'center'});
    doc.setFont("helvetica","normal"); doc.setFontSize(12); doc.setTextColor(80,80,80); doc.text(`NIS: ${s.nis||'-'} | Halaqah: ${s.halaqah}`,148.5,112,{align:'center'});
    doc.setFontSize(14); doc.setTextColor(50,50,50); doc.text("Telah menyelesaikan pencapaian:",148.5,126,{align:'center'});
    doc.setFont("helvetica","bold"); doc.setFontSize(22); doc.setTextColor(21,128,61); doc.text(`"${penghargaan}"`,148.5,138,{align:'center'});
    const today = new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
    doc.setFontSize(12); doc.setTextColor(50,50,50); doc.text(`Ditetapkan: ${today}`,230,168,{align:'center'});
    doc.text("Pimpinan",230,174,{align:'center'});
    doc.line(195,187,265,187);
    doc.setFont("helvetica","bold"); doc.text(state.pengaturan.nama_pimpinan||'Pimpinan',230,191,{align:'center'});
    doc.save(`Syahadah_${n.replace(/\s+/g,'_')}.pdf`);
    Swal.fire('Berhasil','Sertifikat diunduh!','success');
  } catch(e) { Swal.fire('Error', e.message, 'error'); }
};

document.addEventListener('DOMContentLoaded', () => {
  try {
    const p = localStorage.getItem('tahfidz_pengaturan');
    if (p) state.pengaturan = JSON.parse(p);
  } catch(e) {}
  try {
    const u = localStorage.getItem('tahfidz_user');
    if (u) {
      const parsed = JSON.parse(u);
      if (parsed && parsed.username && parsed.role) {
        state.user = parsed;
        loadData();
        return;
      }
    }
  } catch(e) { console.warn('Restore gagal:', e); }
  renderApp();
});
